<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RenderLab</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Inter, system-ui, sans-serif;
  background: #0b0b0d;
  color: #ffffff;
  min-height: 100vh;
  padding: 40px 20px;
}

.container {
  max-width: 520px;
  margin: 0 auto;
}

.card {
  background: #131316;
  border: 1px solid #232328;
  border-radius: 18px;
  padding: 32px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

.badge {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid #2a2a30;
  font-size: 12px;
  font-weight: 500;
  color: #bdbdc7;
  margin-bottom: 18px;
}

h1 {
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.subtitle {
  color: #9d9da8;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 28px;
}

.step {
  display: none;
}

.step.active {
  display: block;
}

.section-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 14px;
  color: #f3f3f5;
}

input,
select {
  width: 100%;
  height: 46px;
  padding: 0 14px;
  margin-bottom: 12px;
  border-radius: 12px;
  border: 1px solid #2a2a30;
  background: #0f0f12;
  color: #ffffff;
  font-size: 14px;
  outline: none;
  transition: 0.2s;
}

input:focus,
select:focus {
  border-color: #5f5fff;
}

input::placeholder {
  color: #7f7f8a;
}

button {
  width: 100%;
  height: 48px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, #5f5fff, #7a4dff);
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
  margin-top: 6px;
}

button:hover {
  opacity: 0.95;
  transform: translateY(-1px);
}

.status {
  margin-top: 20px;
  font-size: 13px;
  color: #a4a4af;
  line-height: 1.5;
}

.footer {
  margin-top: 18px;
  font-size: 12px;
  color: #6f6f78;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <span class="badge">RenderLab SaaS</span>

    <h1>Automação de Vídeos</h1>

    <p class="subtitle">
      Transforme dados em vídeos e convites automaticamente
      com processamento inteligente e entrega em nuvem.
    </p>

    <!-- ETAPA 1 -->
    <div id="step1" class="step active">

      <div class="section-title">
        Dados do Evento
      </div>

      <input
        id="evento"
        placeholder="Nome do evento"
      >

      <select id="produto">
        <option value="">Selecionar produto</option>
        <option value="Videos">Vídeos</option>
        <option value="Convites">Convites</option>
        <option value="Ambos">Ambos</option>
      </select>

      <button onclick="nextStep()">
        Continuar
      </button>

    </div>

    <!-- ETAPA 2 -->
    <div id="step2" class="step">

      <div class="section-title">
        Dados de Produção
      </div>

      <input
        id="fotos"
        placeholder="Fotos dos alunos"
      >

      <input
        id="logo"
        placeholder="Logo da escola"
      >

      <select id="tipo">
        <option value="">Tipo de formatura</option>
        <option value="Infantil">Infantil</option>
        <option value="Ensino Medio">Ensino Médio</option>
        <option value="Superior">Superior</option>
      </select>

      <input
        id="info"
        placeholder="Informações do evento"
      >

      <button onclick="send()">
        Iniciar Produção
      </button>

    </div>

    <div id="status" class="status"></div>

    <div class="footer">
      RenderLab • Workflow inteligente de produção
    </div>

  </div>
</div>

<script>
const webhookURL = "http://SEU_N8N/webhook/form-trigger";

function nextStep() {
  document.getElementById("step1").classList.remove("active");
  document.getElementById("step2").classList.add("active");
}

async function send() {
  const data = {
    nome_evento: document.getElementById("evento").value,
    produto: document.getElementById("produto").value,
    fotos_alunos: document.getElementById("fotos").value,
    logo_escola: document.getElementById("logo").value,
    tipo_formatura: document.getElementById("tipo").value,
    info_evento: document.getElementById("info").value
  };

  document.getElementById("status").innerText =
    "Enviando solicitação para o RenderLab...";

  try {
    await fetch(webhookURL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    document.getElementById("status").innerText =
      "Produção iniciada com sucesso.";
  } catch (error) {
    document.getElementById("status").innerText =
      "Erro ao enviar solicitação.";
  }
}
</script>

</body>
</html>
