<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>RenderLab</title>

<style>
body { font-family: Arial; max-width: 600px; margin: 40px auto; }
.card { padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
input, select, button { width: 100%; padding: 10px; margin: 6px 0; }
.hidden { display: none; }
</style>

</head>

<body>

<div class="card">

<h1>RenderLab</h1>

<!-- ETAPA 1 -->
<div id="step1">

<h3>Portal de Produção</h3>

<input id="evento" placeholder="Nome do Evento" required>

<select id="produto">
  <option value="">Selecionar Produto</option>
  <option value="Videos">Videos</option>
  <option value="Convites">Convites</option>
  <option value="Ambos">Ambos</option>
</select>

<button onclick="nextStep()">Continuar</button>

</div>

<!-- ETAPA 2 -->
<div id="step2" class="hidden">

<h3>Produção</h3>

<input id="fotos" placeholder="Fotos dos Alunos (link ou drive)">
<input id="logo" placeholder="Logo da Escola">

<select id="tipo">
  <option value="">Tipo de Formatura</option>
  <option value="Infantil">Infantil</option>
  <option value="Ensino Medio">Ensino Médio</option>
  <option value="Superior">Superior</option>
</select>

<input id="info" placeholder="Informações do Evento">

<button onclick="send()">Enviar para RenderLab</button>

</div>

<p id="status"></p>

</div>

<script>

const webhookURL = "http://SEU_N8N/webhook/form-trigger";

function nextStep() {
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
}

async function send() {

  const data = {
    nome_evento: document.getElementById("evento").value,
    produto: document.getElementById("produto").value,
    fotos_alunos: document.getElementById("fotos").value,
    logo_escola: document.getElementById("logo").value,
    tipo_formatura: document.getElementById("tipo").value,
    info_evento: document.getElementById("info").value
  };

  document.getElementById("status").innerText = "Enviando...";

  await fetch(webhookURL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  document.getElementById("status").innerText = "Enviado! Render iniciando...";
}

</script>

</body>
</html>
