<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>RenderLab</title>

<style>
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: #0f0f10;
  color: #fff;
}

.container {
  max-width: 700px;
  margin: 60px auto;
  background: #17171a;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

h1 {
  font-size: 32px;
  margin-bottom: 5px;
}

.sub {
  color: #aaa;
  margin-bottom: 30px;
}

input, select {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #333;
  background: #111;
  color: white;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #6d5dfc, #8a2be2);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.step {
  display: none;
}

.active {
  display: block;
}

.status {
  margin-top: 20px;
  color: #aaa;
  font-size: 14px;
}

.badge {
  display: inline-block;
  padding: 4px 10px;
  background: #2a2a2f;
  border-radius: 999px;
  font-size: 12px;
  color: #aaa;
  margin-bottom: 20px;
}
</style>

</head>

<body>

<div class="container">

<span class="badge">RenderLab SaaS</span>
<h1>Automação de Vídeos</h1>
<p class="sub">Transforme dados em vídeos automaticamente</p>

<!-- STEP 1 -->
<div id="step1" class="step active">

<input id="evento" placeholder="Nome do evento">

<select id="produto">
  <option value="">Selecionar produto</option>
  <option>Videos</option>
  <option>Convites</option>
  <option>Ambos</option>
</select>

<button onclick="nextStep()">Continuar</button>

</div>

<!-- STEP 2 -->
<div id="step2" class="step">

<input id="fotos" placeholder="Fotos dos alunos">
<input id="logo" placeholder="Logo da escola">

<select id="tipo">
  <option>Tipo de formatura</option>
  <option>Infantil</option>
  <option>Ensino Médio</option>
  <option>Superior</option>
</select>

<input id="info" placeholder="Informações do evento">

<button onclick="send()">Gerar produção</button>

</div>

<p id="status" class="status"></p>

</div>

<script>

const webhookURL = "http://SEU_N8N/webhook/form-trigger";

function nextStep() {
  document.getElementById("step1").classList.remove("active");
  document.getElementById("step2").classList.add("active");
}

async function send() {

  const data = {
    nome_evento: evento.value,
    produto: produto.value,
    fotos_alunos: fotos.value,
    logo_escola: logo.value,
    tipo_formatura: tipo.value,
    info_evento: info.value
  };

  status.innerText = "Enviando para RenderLab...";

  await fetch(webhookURL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });

  status.innerText = "Processando renderização...";
}

</script>

</body>
</html>
