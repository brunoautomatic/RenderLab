<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>RenderLab</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f6f6;
  color: #1a1a1a;
}

.container {
  max-width: 700px;
  margin: 60px auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
}

h1 {
  font-size: 28px;
  margin-bottom: 5px;
}

.sub {
  color: #666;
  margin-bottom: 25px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 14px;
}

button {
  background: #1a1a1a;
  color: white;
  cursor: pointer;
  border: none;
  transition: 0.2s;
}

button:hover {
  background: #333;
}

.step {
  display: none;
}

.active {
  display: block;
}

.status {
  margin-top: 20px;
  font-weight: bold;
}

.success {
  color: green;
}
</style>
</head>

<body>

<div class="container">

<h1>RenderLab</h1>
<p class="sub">Automação de vídeos para formaturas</p>

<!-- ETAPA 1 -->
<div id="step1" class="step active">

<h3>Dados do Evento</h3>

<input id="evento" placeholder="Nome do evento">

<select id="produto">
  <option value="">Selecionar produto</option>
  <option value="Videos">Videos</option>
  <option value="Convites">Convites</option>
  <option value="Ambos">Ambos</option>
</select>

<button onclick="nextStep()">Continuar</button>

</div>

<!-- ETAPA 2 -->
<div id="step2" class="step">

<h3>Produção</h3>

<input id="fotos" placeholder="Fotos dos alunos (link)">
<input id="logo" placeholder="Logo da escola">

<select id="tipo">
  <option value="">Tipo de formatura</option>
  <option value="Infantil">Infantil</option>
  <option value="Ensino Medio">Ensino Médio</option>
  <option value="Superior">Superior</option>
</select>

<input id="info" placeholder="Informações do evento">

<button onclick="send()">Enviar para RenderLab</button>

</div>

<!-- STATUS -->
<p id="status" class="status"></p>

</div>

<script>

const webhookURL = "http://SEU_N8N/webhook/form-trigger";

function nextStep() {
  document.getElementById("step1").classList.remove("active");
  document.getElementById("step2").classList.add("active");
}

async function send() {

  const data = {
    nome_evento: document.getElementById("evento").value,
    produto: document.getElementById("produto").value,
    fotos_alunos: document.getElementById("fotos").value,
    logo_escola: document.getElementById("logo").value,
    tipo_formatura: document.getElementById("tipo").value,
    info_evento: document.getElementById("info").value
  };

  document.getElementById("status").innerText = "Enviando solicitação...";

  try {
    await fetch(webhookURL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    simulateProgress();

  } catch (e) {
    document.getElementById("status").innerText = "Erro ao enviar.";
  }
}

// simulação de UX (vamos trocar depois pelo status real)
function simulateProgress() {

  let steps = [
    "Processando dados...",
    "Baixando arquivos...",
    "Renderizando vídeo...",
    "Enviando para nuvem..."
  ];

  let i = 0;

  let interval = setInterval(() => {

    document.getElementById("status").innerText = steps[i];

    i++;

    if (i === steps.length) {
      clearInterval(interval);
      document.getElementById("status").innerHTML =
        "<span class='success'>Concluído! Vídeo pronto 🎉</span>";
    }

  }, 1500);
}

</script>

</body>
</html>
