<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applause | RenderLab</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "Segoe UI", sans-serif;

  background: radial-gradient(
    circle at top,
    #ffffff 0%,
    #f2f2f6 40%,
    #e9e9ee 100%
  );

  color: #1d1d1f;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CONTAINER CENTRAL */

.hero {
  text-align: center;
  max-width: 820px;
  padding: 40px;
}

/* LOGO */

.logo-box {
  margin-bottom: 28px;
  display: flex;
  justify-content: center;
}

.logo-bg {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 12px 16px;
  border-radius: 16px;

  background: rgba(0,0,0,0.04);
  border: 1px solid rgba(0,0,0,0.06);
}

.logo {
  height: 48px;
}

/* TEXT */

h1 {
  font-size: 64px;
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -2px;
  margin-bottom: 24px;
}

.highlight {
  color: #b89b4c;
}

.subtitle {
  font-size: 20px;
  line-height: 1.6;
  color: #6e6e73;
  max-width: 640px;
  margin: 0 auto 40px auto;
}

/* BUTTON */

.buttons {
  display: flex;
  justify-content: center;
}

.action-btn {
  min-height: 54px;
  padding: 16px 32px;
  border-radius: 999px;
  text-decoration: none;
  font-size: 15px;
  font-weight: 600;
  transition: 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #b89b4c;
  color: white;
  box-shadow: 0 12px 30px rgba(184,155,76,0.14);
}

.action-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 40px rgba(184,155,76,0.18);
}

/* MOBILE */

@media (max-width: 768px) {
  h1 {
    font-size: 40px;
  }

  .subtitle {
    font-size: 17px;
  }

  .logo {
    height: 42px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="logo-box">
    <div class="logo-bg">
      <img src="assets/logo_applause.png" class="logo" alt="Applause">
    </div>
  </div>

  <h1>
    A nova forma de produzir suas
    <span class="highlight">Mídias</span>
  </h1>

  <p class="subtitle">
    Vídeos e convites com entregas automatizadas, workflow inteligente e produção organizada do início ao fim.
  </p>

  <div class="buttons">
    <a href="producao.html" class="action-btn">
      Iniciar Produção
    </a>
  </div>

</section>

</body>
</html>
