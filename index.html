<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applause | RenderLab</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "Segoe UI", sans-serif;

  background: radial-gradient(
    circle at top,
    #ffffff 0%,
    #f2f2f6 45%,
    #e9e9ee 100%
  );

  color: #1d1d1f;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

/* CAMADA DE LUZ AMBIENTE */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background:
    radial-gradient(circle at 25% 15%, rgba(184,155,76,0.12), transparent 45%),
    radial-gradient(circle at 80% 40%, rgba(0,0,0,0.05), transparent 50%);

  pointer-events: none;
}

/* CONTAINER */
.hero {
  text-align: center;
  max-width: 820px;
  padding: 40px;
}

/* LOGO + HALO NATURAL */
.logo-box {
  margin-bottom: 28px;
  display: flex;
  justify-content: center;
  position: relative;
}

/* halo real (sem caixa) */
.logo-box::before {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;

  background: radial-gradient(
    circle,
    rgba(184,155,76,0.25),
    transparent 60%
  );

  filter: blur(18px);

  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  z-index: 0;
}

.logo {
  height: 54px;
  position: relative;
  z-index: 2;

  filter: drop-shadow(0 10px 25px rgba(0,0,0,0.12));
}

/* TEXTO */
h1 {
  font-size: 64px;
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -2px;
  margin-bottom: 24px;

  text-shadow: 0 10px 40px rgba(0,0,0,0.08);
}

.highlight {
  color: #b89b4c;
}

.subtitle {
  font-size: 20px;
  line-height: 1.6;
  color: #6e6e73;
  max-width: 640px;
  margin: 0 auto 40px auto;
}

/* BOTÃO */
.buttons {
  display: flex;
  justify-content: center;
}

.action-btn {
  min-height: 54px;
  padding: 16px 32px;
  border-radius: 999px;

  text-decoration: none;
  font-size: 15px;
  font-weight: 600;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  background: #b89b4c;
  color: white;

  box-shadow:
    0 18px 45px rgba(184,155,76,0.28),
    0 6px 16px rgba(0,0,0,0.10);

  transition: all 0.25s ease;
}

.action-btn:hover {
  transform: translateY(-3px);
  box-shadow:
    0 25px 60px rgba(184,155,76,0.35),
    0 8px 20px rgba(0,0,0,0.12);
}

/* MOBILE */
@media (max-width: 768px) {
  h1 {
    font-size: 40px;
  }

  .subtitle {
    font-size: 17px;
  }

  .logo {
    height: 42px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="logo-box">
    <img src="assets/logo_applause.png" class="logo" alt="Applause">
  </div>

  <h1>
    Produção de
    <span class="highlight">Mídias</span>
  </h1>

  <p class="subtitle">
    Vídeos e convites com entregas automatizadas, workflow inteligente e produção organizada do início ao fim.
  </p>

  <div class="buttons">
    <a href="producao.html" class="action-btn">
      Iniciar Produção
    </a>
  </div>

</section>

</body>
</html>
