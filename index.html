<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applause | RenderLab</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "Segoe UI", sans-serif;

  background: radial-gradient(circle at top, #ffffff, #f2f2f6 55%, #e9e9ee);

  color: #1d1d1f;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

/* 🌫️ FUNDO COM PROFUNDIDADE */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background:
    radial-gradient(circle at 20% 20%, rgba(184,155,76,0.18), transparent 50%),
    radial-gradient(circle at 80% 40%, rgba(0,0,0,0.05), transparent 55%);

  animation: bgFloat 12s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes bgFloat {
  0%   { transform: translateY(0px) scale(1); }
  100% { transform: translateY(-20px) scale(1.03); }
}

/* CONTAINER */
.hero {
  text-align: center;
  max-width: 820px;
  padding: 40px;
}

/* 🔥 LOGO + HALO GRANDE */
.logo-box {
  margin-bottom: 28px;
  display: flex;
  justify-content: center;
  position: relative;

  animation: fadeUp 1s ease forwards;
  opacity: 0;
}

.logo-box::before {
  content: "";
  position: absolute;

  width: 380px;
  height: 380px;

  background: radial-gradient(
    circle,
    rgba(184,155,76,0.32) 0%,
    rgba(184,155,76,0.12) 40%,
    transparent 70%
  );

  filter: blur(32px);

  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  z-index: 0;

  animation: pulse 6s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.6;
  }
  50% {
    transform: translate(-50%, -50%) scale(1.1);
    opacity: 0.95;
  }
}

.logo {
  height: 58px;
  position: relative;
  z-index: 2;

  filter: drop-shadow(0 15px 35px rgba(0,0,0,0.15));

  animation: floatLogo 6s ease-in-out infinite;
}

@keyframes floatLogo {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* TEXTOS COM ENTRADA ESCALONADA */
h1 {
  font-size: 64px;
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -2px;
  margin-bottom: 24px;

  opacity: 0;
  animation: fadeUp 1.2s ease forwards;
  animation-delay: 0.2s;

  text-shadow: 0 10px 40px rgba(0,0,0,0.08);
}

.highlight {
  color: #b89b4c;
}

.subtitle {
  font-size: 20px;
  line-height: 1.6;
  color: #6e6e73;
  max-width: 640px;
  margin: 0 auto 40px auto;

  opacity: 0;
  animation: fadeUp 1.3s ease forwards;
  animation-delay: 0.35s;
}

/* BOTÃO */
.buttons {
  display: flex;
  justify-content: center;

  opacity: 0;
  animation: fadeUp 1.4s ease forwards;
  animation-delay: 0.5s;
}

.action-btn {
  min-height: 54px;
  padding: 16px 34px;
  border-radius: 999px;

  text-decoration: none;
  font-size: 15px;
  font-weight: 600;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  background: #b89b4c;
  color: white;

  box-shadow:
    0 22px 55px rgba(184,155,76,0.30),
    0 8px 18px rgba(0,0,0,0.10);

  transition: all 0.25s ease;
}

.action-btn:hover {
  transform: translateY(-4px) scale(1.03);

  box-shadow:
    0 30px 80px rgba(184,155,76,0.38),
    0 12px 25px rgba(0,0,0,0.14);
}

/* ANIMAÇÃO BASE */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MOBILE */
@media (max-width: 768px) {
  h1 {
    font-size: 40px;
  }

  .subtitle {
    font-size: 17px;
  }

  .logo {
    height: 44px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="logo-box">
    <img src="assets/logo_applause.png" class="logo" alt="Applause">
  </div>

  <h1>
    A nova forma de produzir suas
    <span class="highlight">Mídias</span>
  </h1>

  <p class="subtitle">
    Vídeos e convites com entregas automatizadas, workflow inteligente e produção organizada do início ao fim.
  </p>

  <div class="buttons">
    <a href="producao.html" class="action-btn">
      Iniciar Produção
    </a>
  </div>

</section>

</body>
</html>
