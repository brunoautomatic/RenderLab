<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applause | RenderLab</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "Segoe UI", sans-serif;

  background: radial-gradient(circle at top, #ffffff, #f2f2f6 50%, #e9e9ee);

  color: #1d1d1f;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

/* 🌫️ fundo vivo animado */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background:
    radial-gradient(circle at 20% 20%, rgba(184,155,76,0.18), transparent 45%),
    radial-gradient(circle at 80% 40%, rgba(0,0,0,0.05), transparent 55%);

  animation: floatBg 10s ease-in-out infinite alternate;

  pointer-events: none;
}

@keyframes floatBg {
  0%   { transform: translateY(0px) scale(1); }
  100% { transform: translateY(-15px) scale(1.02); }
}

/* CONTAINER */
.hero {
  text-align: center;
  max-width: 820px;
  padding: 40px;

  animation: fadeUp 1s ease forwards;
  opacity: 0;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* LOGO */
.logo-box {
  margin-bottom: 28px;
  display: flex;
  justify-content: center;
  position: relative;
}

/* glow vivo */
.logo-box::before {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;

  background: radial-gradient(circle, rgba(184,155,76,0.35), transparent 60%);
  filter: blur(20px);

  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  animation: pulse 4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
  50%      { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
}

.logo {
  height: 54px;
  position: relative;
  z-index: 2;

  animation: floatLogo 6s ease-in-out infinite;
  filter: drop-shadow(0 12px 25px rgba(0,0,0,0.12));
}

@keyframes floatLogo {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* TEXT */
h1 {
  font-size: 64px;
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -2px;
  margin-bottom: 24px;

  animation: fadeUp 1.2s ease forwards;
}

.highlight {
  color: #b89b4c;
}

.subtitle {
  font-size: 20px;
  line-height: 1.6;
  color: #6e6e73;
  max-width: 640px;
  margin: 0 auto 40px auto;

  animation: fadeUp 1.4s ease forwards;
}

/* BUTTON */
.buttons {
  display: flex;
  justify-content: center;

  animation: fadeUp 1.6s ease forwards;
}

.action-btn {
  min-height: 54px;
  padding: 16px 32px;
  border-radius: 999px;

  text-decoration: none;
  font-size: 15px;
  font-weight: 600;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  background: #b89b4c;
  color: white;

  box-shadow:
    0 18px 45px rgba(184,155,76,0.28),
    0 6px 16px rgba(0,0,0,0.10);

  transition: all 0.25s ease;
}

.action-btn:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow:
    0 30px 70px rgba(184,155,76,0.35),
    0 10px 25px rgba(0,0,0,0.12);
}

/* MOBILE */
@media (max-width: 768px) {
  h1 {
    font-size: 40px;
  }

  .subtitle {
    font-size: 17px;
  }

  .logo {
    height: 42px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="logo-box">
    <img src="assets/logo_applause.png" class="logo" alt="Applause">
  </div>

  <h1>
    A nova forma de produzir suas
    <span class="highlight">Mídias</span>
  </h1>

  <p class="subtitle">
    Vídeos e convites com entregas automatizadas, workflow inteligente e produção organizada do início ao fim.
  </p>

  <div class="buttons">
    <a href="producao.html" class="action-btn">
      Iniciar Produção
    </a>
  </div>

</section>

</body>
</html>
