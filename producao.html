<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RenderLab | Produção</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <div class="container">

    <div class="card">

      <div class="badge">
        RenderLab • Portal de Produção
      </div>

      <h2>
        Iniciar Produção
      </h2>

      <p class="subtitle">
        Preencha os dados abaixo para iniciar a renderização automática
        de vídeos e convites personalizados.
      </p>

      <!-- ETAPA 1 -->
      <div id="step1" class="step active">

        <div class="section-title">
          Dados do Evento
        </div>

        <label class="input-label">
          Nome do Evento
        </label>

        <input
          id="evento"
          placeholder="Ex: Formatura Terceirão 2026"
        >

        <label class="input-label">
          Produto
        </label>

        <select id="produto">
          <option value="">Selecionar Produto</option>
          <option value="Videos">Vídeos</option>
          <option value="Convites">Convites</option>
          <option value="Ambos">Ambos</option>
        </select>

        <div class="buttons">
          <button
            class="btn-primary"
            onclick="nextStep()"
          >
            Continuar
          </button>
        </div>

      </div>

      <!-- ETAPA 2 -->
      <div id="step2" class="step">

        <div class="section-title">
          Dados de Produção
        </div>

        <label class="input-label">
          Fotos dos Alunos
        </label>

        <input
          type="file"
          id="fotos"
          multiple
        >

        <label class="input-helper">
          Selecione todas as fotos que serão utilizadas
        </label>

        <label class="input-label">
          Logo da Escola
        </label>

        <input
          type="file"
          id="logo"
        >

        <label class="input-helper">
          Arquivo PNG ou JPG com boa qualidade
        </label>

        <label class="input-label">
          Tipo de Formatura
        </label>

        <select id="tipo">
          <option value="">Selecionar Tipo</option>
          <option value="Infantil">Infantil</option>
          <option value="Ensino Medio">Ensino Médio</option>
          <option value="Superior">Superior</option>
        </select>

        <label class="input-label">
          Informações e Endereço do Evento
        </label>

        <input
          id="info"
          placeholder="Ex: Salão XYZ • Rua X • 20h"
        >

        <div class="buttons">

          <button
            class="btn-secondary"
            onclick="prevStep()"
          >
            Voltar
          </button>

          <button
            class="btn-primary"
            onclick="RenderLab.startProduction()"
          >
            Iniciar Produção
          </button>

        </div>

      </div>

      <div
        id="status"
        class="status"
      ></div>

      <div class="footer">
        RenderLab • Workflow inteligente de produção
      </div>

    </div>

  </div>

  <script>
    function nextStep() {
      const evento =
        document.getElementById("evento").value;

      const produto =
        document.getElementById("produto").value;

      if (!evento || !produto) {
        document.getElementById("status").innerText =
          "Preencha Nome do Evento e Produto.";
        return;
      }

      document.getElementById("status").innerText = "";

      document
        .getElementById("step1")
        .classList.remove("active");

      document
        .getElementById("step2")
        .classList.add("active");
    }

    function prevStep() {
      document
        .getElementById("step2")
        .classList.remove("active");

      document
        .getElementById("step1")
        .classList.add("active");
    }
  </script>

  <script src="script.js"></script>

</body>
</html>
