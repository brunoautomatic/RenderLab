<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RenderLab | Produção</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top, #ffffff, #f2f2f6 60%, #e9e9ee);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1d1d1f;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(184,155,76,0.12), transparent 45%),
                radial-gradient(circle at 80% 60%, rgba(0,0,0,0.05), transparent 55%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 720px;
            padding: 40px;
        }

        .card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 38px;
            box-shadow:
                0 40px 100px rgba(0,0,0,0.08),
                0 10px 30px rgba(0,0,0,0.05);
        }

        .logo-top {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
        }

        .logo-top img {
            height: 46px;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 12px 25px rgba(0,0,0,0.12));
        }

        .badge {
            font-size: 12px;
            color: #86868b;
            margin-bottom: 18px;
            text-align: center;
        }

        h2 {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -1px;
            text-align: center;
        }

        .subtitle {
            font-size: 16px;
            color: #6e6e73;
            margin-bottom: 30px;
            line-height: 1.5;
            text-align: center;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
            animation: fadeUp 0.4s ease;
        }

        .input-label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #444;
            font-weight: 500;
            margin-top: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(255,255,255,0.9);
            font-size: 14px;
            outline: none;
            margin-bottom: 8px;
            transition: 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: #b89b4c;
            box-shadow: 0 0 0 4px rgba(184,155,76,0.15);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-primary {
            flex: 2;
            padding: 14px;
            border-radius: 999px;
            border: none;
            background: #b89b4c;
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 20px 50px rgba(184,155,76,0.25);
        }

        .btn-secondary {
            flex: 1;
            padding: 14px;
            border-radius: 999px;
            border: 1px solid rgba(0,0,0,0.12);
            background: white;
            cursor: pointer;
        }

        .status {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
        }

        #check-logo-status {
            font-size: 11px;
            font-weight: 600;
            transition: 0.3s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="logo-top">
            <img src="assets/logo_applause.png" alt="RenderLab">
        </div>

        <div class="badge">
            RenderLab • Portal de Produção
        </div>

        <h2 id="form-title">
            Iniciar Produção
        </h2>

        <p class="subtitle">
            Configure os detalhes da sua automação.
        </p>

        <!-- STEP 1 -->
        <div id="step1" class="step active">

            <label class="input-label">
                Nome do Evento
            </label>

            <input
                id="evento"
                placeholder="Ex: Formatura Terceirão 2026"
            >

            <label class="input-label">
                Produto
            </label>

            <select id="produto">
                <option value="">Selecionar</option>
                <option value="Videos">Vídeos</option>
                <option value="Convites">Convites</option>
                <option value="Ambos">Ambos</option>
            </select>

            <label class="input-label">
                Escopo do Render
            </label>

            <select id="escopo">
                <option value="Aluno">Aluno</option>
                <option value="Turma">Turma</option>
            </select>

            <div class="buttons">
                <button class="btn-primary" onclick="nextStep()">
                    Continuar
                </button>
            </div>

        </div>

        <!-- STEP 2 -->
        <div id="step2" class="step">

            <label class="input-label">
                Nome da Instituição (Escola)
            </label>

            <input
                id="nome_escola"
                placeholder="Digite o nome exato para busca"
                onblur="RenderLab.verificarLogo()"
            >

            <div id="check-logo-status"></div>

            <div
                id="secao-upload-logo"
                style="
                    display:none;
                    border:1px dashed #b89b4c;
                    padding:15px;
                    border-radius:14px;
                    margin:10px 0;
                "
            >

                <label
                    class="input-label"
                    style="color:#b89b4c;margin-top:0;"
                >
                    ⚠️ Logo não encontrado. Anexe agora:
                </label>

                <input
                    type="file"
                    id="logo_file"
                    accept="image/*"
                >

            </div>

            <label class="input-label">
                Anexar Fotos dos Alunos
            </label>

            <input
                type="file"
                id="fotos"
                multiple
                accept="image/*"
            >

            <!-- CAMPOS CONVITE -->
            <div id="campos-convite" style="display:none;">

                <label class="input-label">
                    Tipo de Formatura
                </label>

                <select id="tipo_formatura">
                    <option value="Formatura Ensino Fundamental">
                        Formatura Ensino Fundamental
                    </option>

                    <option value="Formatura Ensino Médio">
                        Formatura Ensino Médio
                    </option>

                    <option value="Formatura Ensino Superior">
                        Formatura Ensino Superior
                    </option>
                </select>

                <label class="input-label">
                    Data e Hora
                </label>

                <input
                    id="data_hora"
                    placeholder="Ex: 15/12/2026 às 19:30"
                >

                <label class="input-label">
                    Local
                </label>

                <input
                    id="local_evento"
                    placeholder="Ex: Salão Nobre do Clube"
                >

                <label class="input-label">
                    Endereço
                </label>

                <input
                    id="endereco_evento"
                    placeholder="Rua, Número, Bairro"
                >

            </div>

            <div class="buttons">

                <button class="btn-secondary" onclick="prevStep()">
                    Voltar
                </button>

                <button
                    id="btn-final"
                    class="btn-primary"
                    onclick="RenderLab.startProduction()"
                >
                    Iniciar Renderização
                </button>

            </div>

        </div>

        <div id="status" class="status"></div>

    </div>
</div>

<script>

const URL_BASE = "https://applause.loca.lt/webhook";

const WEBHOOK_INICIAR =
    `${URL_BASE}/iniciar-producao`;

const WEBHOOK_CHECK_LOGO =
    `${URL_BASE}/verificar-logo`;

function nextStep() {

    const evento =
        document.getElementById("evento").value;

    const produto =
        document.getElementById("produto").value;

    if (!evento || !produto) {

        alert("Preencha o Nome do Evento e o Produto.");

        return;
    }

    const camposConvite =
        document.getElementById("campos-convite");

    camposConvite.style.display =
        (
            produto === "Convites"
            || produto === "Ambos"
        )
        ? "block"
        : "none";

    document
        .getElementById("step1")
        .classList.remove("active");

    document
        .getElementById("step2")
        .classList.add("active");
}

function prevStep() {

    document
        .getElementById("step2")
        .classList.remove("active");

    document
        .getElementById("step1")
        .classList.add("active");
}

const RenderLab = {

    async verificarLogo() {

        const escola =
            document.getElementById("nome_escola").value;

        const statusMsg =
            document.getElementById("check-logo-status");

        const secaoUpload =
            document.getElementById("secao-upload-logo");

        if (escola.length < 3) return;

        statusMsg.style.color = "#86868b";

        statusMsg.innerText =
            "🔍 Verificando banco de logos...";

        try {

            const response = await fetch(
                WEBHOOK_CHECK_LOGO,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Bypass-Tunnel-Reminder": "true"
                    },

                    body: JSON.stringify({
                        nome_escola: escola
                    })
                }
            );

            const data = await response.json();

            if (data.existe) {

                statusMsg.style.color = "green";

                statusMsg.innerText =
                    "✅ Logo encontrado e pronto para uso.";

                secaoUpload.style.display = "none";

            } else {

                statusMsg.style.color = "#b89b4c";

                statusMsg.innerText =
                    "⚠️ Logo não encontrado localmente.";

                secaoUpload.style.display = "block";
            }

        } catch (e) {

            statusMsg.innerText =
                "❌ Erro ao conectar com o servidor local.";
        }
    },

    async startProduction() {

        const statusDiv =
            document.getElementById("status");

        const btn =
            document.getElementById("btn-final");

        statusDiv.style.color = "#b89b4c";

        statusDiv.innerText =
            "Enviando dados da produção...";

        btn.disabled = true;

        try {

            const formData = new FormData();

            formData.append(
                "evento",
                document.getElementById("evento").value
            );

            formData.append(
                "produto",
                document.getElementById("produto").value
            );

            formData.append(
                "escopo",
                document.getElementById("escopo").value
            );

            formData.append(
                "nome_escola",
                document.getElementById("nome_escola").value
            );

            formData.append(
                "tipo_formatura",
                document.getElementById("tipo_formatura").value
            );

            formData.append(
                "data_hora",
                document.getElementById("data_hora").value
            );

            formData.append(
                "local",
                document.getElementById("local_evento").value
            );

            formData.append(
                "endereco",
                document.getElementById("endereco_evento").value
            );

            // FOTOS
            const fotosInput =
                document.getElementById("fotos");

            for (const foto of fotosInput.files) {

                formData.append(
                    "fotos",
                    foto
                );
            }

            // LOGO
            const logoInput =
                document.getElementById("logo_file");

            if (logoInput.files.length > 0) {

                formData.append(
                    "logo",
                    logoInput.files[0]
                );
            }

            const response = await fetch(
                WEBHOOK_INICIAR,
                {
                    method: "POST",

                    headers: {
                        "Bypass-Tunnel-Reminder": "true"
                    },

                    body: formData
                }
            );

            if (!response.ok) {
                throw new Error();
            }

            const data = await response.json();

            statusDiv.style.color = "green";

            statusDiv.innerText =
                data.message
                || "✅ Produção iniciada com sucesso!";

            setTimeout(() => {
                location.reload();
            }, 3000);

        } catch (e) {

            statusDiv.style.color = "#b00020";

            statusDiv.innerText =
                "❌ Falha ao iniciar. Verifique o n8n/Túnel.";

            btn.disabled = false;
        }
    }
};

</script>

</body>
</html>
